# Modelo das chaves esperadas no Secret fgc-users-api-secret - sem valores.
# Não aplicar este arquivo: no EKS o Secret é criado pelo External Secrets Operator a partir do
# AWS Secrets Manager (ExternalSecret, Sprint 8). Para teste manual:
#   kubectl create secret generic fgc-users-api-secret --from-literal=Jwt__Key=... (etc.)
apiVersion: v1
kind: Secret
metadata:
  name: fgc-users-api-secret
  labels:
    app: fgc-users-api
type: Opaque
stringData:
  ConnectionStrings__UserDb: ""   # Host=<rds-endpoint>;Port=5432;Database=fgc_users;Username=...;Password=...
  Jwt__Key: ""                 # mesma chave HS256 de Users, Catalog, Kong e Lambda HistoryApi
  RabbitMq__Username: ""       # usuário do broker Amazon MQ
  RabbitMq__Password: ""
