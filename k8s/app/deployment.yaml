apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgc-users-api
  labels:
    app: fgc-users-api
spec:
  replicas: 2
  # Zero downtime: sobe um pod novo, espera ficar Ready, só então derruba um antigo.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fgc-users-api
  template:
    metadata:
      labels:
        app: fgc-users-api
    spec:
      serviceAccountName: fgc-users-api
      securityContext:
        runAsNonRoot: true
      # Espalha as réplicas entre os nós (perder um nó não derruba o serviço).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: fgc-users-api
      containers:
        - name: fgc-users-api
          image: fgc-users-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fgc-users-api-config
            - secretRef:
                name: fgc-users-api-secret
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # Continua atendendo enquanto o kube-proxy/Kong param de enviar tráfego ao pod.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          # Ready = banco e broker ok (Redis/DynamoDB só degradam - ver HealthCheckExtensions).
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
