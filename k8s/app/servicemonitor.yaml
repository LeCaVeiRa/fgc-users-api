# Scrape de /metrics (prometheus-net) pelo Prometheus do kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fgc-users-api
  labels:
    app: fgc-users-api
spec:
  selector:
    matchLabels:
      app: fgc-users-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
